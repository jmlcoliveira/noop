name = "pulse-backup"
main = "src/index.mjs"
compatibility_date = "2026-05-21"
workers_dev = false
preview_urls = false
send_metrics = false

[[routes]]
pattern = "pulse.joliveira.xyz"
custom_domain = true

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "pulse-backups"
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "BackupAccount"

[[durable_objects.bindings]]
name = "MIGRATION_CLAIMS"
class_name = "BackupMigrationClaim"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackupAccount"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BackupMigrationClaim"]
